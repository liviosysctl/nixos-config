# Read at runtime by Cava.qml (`cava -p <this file>`).
#
# `bars` is the source of truth for the frame width; Cava.qml mirrors it in
# its own `bars` property so the renderers can size themselves before the
# first frame arrives. Change it in both places or the tail of every frame
# gets dropped.

[general]
mode = normal
framerate = 30
bars = 16
autosens = 1
lower_cutoff_freq = 40
higher_cutoff_freq = 12000

[input]
# cava 0.10 speaks pipewire directly. `auto` follows the default sink's
# monitor, so it keeps working across sink changes without a restart.
method = pipewire
source = auto

[smoothing]
noise_reduction = 40

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
# One frame per line: `bars` values in 0-100 separated by ';', newline
# terminated. Matches the SplitParser in Cava.qml.
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
